[workspace]
members = [".", "natdb-sys"]
resolver = "3"

[workspace.package]
edition = "2024"
# Edition 2024 requires Rust 1.85. Verified with `cargo +1.85.0 test --workspace`.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/JhonaCodes/natdb"
homepage = "https://github.com/JhonaCodes/natdb"

[workspace.dependencies]
libc = "0.2.189"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[package]
name = "natdb"
version = "0.1.0"
description = "Safe, idiomatic Rust bindings for LMDB 1.0 (maintained fork of lmdb-rkv)."
readme = "README.md"
keywords = ["lmdb", "database", "storage-engine", "bindings", "key-value"]
categories = ["database"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/natdb"
exclude = ["/.github", "/docs"]

[lib]
name = "natdb"

[dependencies]
bitflags = "2.13.2"
libc.workspace = true
natdb-sys = { path = "natdb-sys", version = "0.1.0" }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
